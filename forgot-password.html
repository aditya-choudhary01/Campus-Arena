<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusArena - Forgot Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="forms.css">
</head>

<body>

<header>
    <a href="index.html" class="logo">Campus<span>Arena</span></a>
    <nav>
        <a href="index.html">Home</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="teammates.html">Find Teammate</a>
        <a href="rules.html">Rules</a>
        <a href="about.html">About</a>
        <a href="login.html" class="active">Login</a>
    </nav>
    <a href="register.html" class="nav-btn">Register Free</a>
</header>

<main>
    <div class="login-container">
        <span class="brand-tag">Account help</span>
        <h1>Forgot password</h1>
        <p class="subtitle">Enter your college email. This beginner demo saves a reset request to data/password-resets.json.</p>

        <p id="form-message" class="form-message" hidden></p>

        <form id="forgot-form" novalidate>
            <div class="form-group">
                <label for="email">College email</label>
                <input type="email" id="email" placeholder="you@college.edu">
                <p class="error-text" id="email-error"></p>
            </div>
            <button type="submit" class="login-submit" id="forgot-submit">Send reset request</button>
        </form>

        <div class="signup">
            Remembered it?
            <a href="login.html">Back to login</a>
        </div>
    </div>
</main>

<footer>
    <div>© 2026 CampusArena - College Gaming Hub</div>
    <div>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="register.html">Register</a>
    </div>
</footer>

<script src="js/common.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
